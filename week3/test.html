<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>What can Javascript Do?
    </h2>

    <p id="demo"> Javascript สามารถเปลี่ยน HTML content. ได้</p>

    <button type="button" onclick='document.getElementById("demo").style.fontSize
                                    ="35px" ; document.getElementById ("demo").innerHTML = "Hello World";'>Click me</button>

    <br><br>
    <p>ใช้ Javascript เปลี่ยนค่า attribute ( src = source ) ของ image.</p>
    
    <button  type="button" onclick="document.getElementById('myimg').src='./img/pic_bulbon.gif'">Turn on </button>
    <img id="myimg" src="./img/pic_bulboff.gif" style="width :100px;">
    <button  type="button" onclick="document.getElementById('myimg').src='./img/pic_bulboff.gif'">Turn off </button>

    
    <div id="random">
        <p>นี่คือข้อความในไฟล์ HTML</p>
    </div>

    <script src="index.js"></script>
</body>
</html>
